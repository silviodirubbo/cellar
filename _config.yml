title: Silvio's Cellar
description: Friendly wine tastings in Geneva.
lang: en_GB
baseurl: "/cellar"
url: "https://silviodirubbo.github.io"
# Build
markdown: kramdown
# Both are on the GitHub Pages allow-list: jekyll-seo-tag writes the
# canonical, Open Graph and Twitter tags ({% seo %} in _layouts/default.html),
# jekyll-sitemap writes /sitemap.xml
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
highlighter: rouge
permalink: pretty
future: true
# Excludes
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - scripts
  - tools
  - README.md
  - assets/social
# Collections
collections:
  tastings:
    output: true
    permalink: /tastings/:name/
  chapters:
    output: true
    permalink: /chapters/:name/
# Defaults
defaults:
  - scope:
      path: ""
      type: "tastings"
    values:
      layout: "presentation"
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: "chapter"
