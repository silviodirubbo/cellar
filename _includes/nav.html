<nav class="nav">
  <div class="nav__inner">

    <a class="nav__logo" href="{{ '/' | relative_url }}" aria-label="Cellar home">
      <svg width="48" height="16" viewBox="0 0 96 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="16" cy="16" r="13" stroke="#1A1814" stroke-width="1.4"/>
        <circle cx="48" cy="16" r="13" fill="#2C4A3E"/>
        <circle cx="80" cy="16" r="13" stroke="#1A1814" stroke-width="1.4"/>
      </svg>
      <span class="nav__wordmark">CELLAR</span>
    </a>

    <!-- Hamburger toggle (mobile only) -->
    <button class="nav__burger" id="nav-burger" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav__links" id="nav-links">
      <li class="nav__item"><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
      <li class="nav__item"><a href="{{ '/tastings/' | relative_url }}" {% if page.url contains '/tastings' %}class="active"{% endif %}>Tastings</a></li>
      <li class="nav__item"><a href="{{ '/planner/' | relative_url }}" {% if page.url contains '/planner' %}class="active"{% endif %}>Planner</a></li>
    </ul>

  </div>
</nav>

<script>
  const burger = document.getElementById('nav-burger');
  const links  = document.getElementById('nav-links');
  burger.addEventListener('click', () => {
    const open = links.classList.toggle('nav__links--open');
    burger.setAttribute('aria-expanded', open);
    burger.classList.toggle('nav__burger--open', open);
  });
  // Close on link click
  links.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      links.classList.remove('nav__links--open');
      burger.classList.remove('nav__burger--open');
      burger.setAttribute('aria-expanded', false);
    });
  });
</script>
