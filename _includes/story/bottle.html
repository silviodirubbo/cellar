{% comment %}
  Wine bottle glyph: outline with a two-band tinted fill (liquid level).
  Colour comes from --bottle-red/--bottle-white/--bottle-rose, set per
  background in main.css's story section.
  Params: type (red | white | rose), id (unique per instance, for the clip).
{% endcomment %}
<svg class="story-bottle story-bottle--{{ include.type }}" viewBox="0 0 64 148" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <clipPath id="bottle-clip-{{ include.id }}">
      <path d="M22,0 L42,0 L42,6 L36,6 L36,26 L54,50 L54,140 A4,4 0 0 1 50,144 L14,144 A4,4 0 0 1 10,140 L10,50 L28,26 L28,6 L22,6 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bottle-clip-{{ include.id }})">
    <rect class="story-bottle__fill-upper" x="0" y="26" width="64" height="64"/>
    <rect class="story-bottle__fill-lower" x="0" y="90" width="64" height="58"/>
  </g>
  <line class="story-bottle__divider" x1="10" y1="90" x2="54" y2="90"/>
  <path class="story-bottle__outline" d="M22,0 L42,0 L42,6 L36,6 L36,26 L54,50 L54,140 A4,4 0 0 1 50,144 L14,144 A4,4 0 0 1 10,140 L10,50 L28,26 L28,6 L22,6 Z"/>
</svg>
