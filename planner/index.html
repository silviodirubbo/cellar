<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Moved · {{ site.title }}</title>
  <meta http-equiv="refresh" content="0; url={{ '/tastings/' | relative_url }}">
  <script>
    // The planner no longer exists: sign-up and proposals now live on the
    // Tastings page. Old links (/planner/#propose, /planner/#<slug>) still
    // land on the right dialog.
    (function () {
      var target = {{ '/tastings/' | relative_url | jsonify }};
      var h = location.hash.slice(1);
      if (h === 'propose') target += '#propose';
      else if (h) target += '#join-' + h;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>The planner has moved to the <a href="{{ '/tastings/' | relative_url }}">Tastings page</a>.</p>
</body>
</html>
