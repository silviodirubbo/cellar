# _data/tastings.yml
# ─────────────────────────────────────────────────────────────
# Schema for each tasting:
#
#   slug:              unique identifier, used in URLs
#   title:             full name of the tasting
#   date:              YYYY-MM-DD or null if TBD
#   date_tbd:          true if date not yet decided
#   location:          venue name or address
#   region:            primary region (displayed as label)
#   description:       one or two sentences, kept short
#   tags:              list of grape/region/theme tags
#   chapter:           pilot | rhone | loire | ... (see _chapters/*.md for the
#                      full list; curriculum chapter, colour driven by that file)
#   chapter_order:     integer, position within the chapter's curriculum
#                      sequence (not chronological order: several TBD entries
#                      share no real date, so this is the only ordering signal)
#   status:            upcoming | past (kept in sync daily by
#                      scripts/sync-tasting-status.js, not by position in this
#                      file, so entries are not grouped by status below)
#   spots_total:       integer
#   cost_estimate:     string e.g. "32 CHF"
#   featured:          true | false
#   slides:            true once presentation is ready
#   wines:             list of wines (for presentation slides)
# ─────────────────────────────────────────────────────────────

