<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <!-- description, canonical, Open Graph and Twitter tags (jekyll-seo-tag;
       the title tag above stays ours, hence title=false) -->
  {% seo title=false %}

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">

  <!-- Fonts, self-hosted (assets/css/fonts.css); the body face is preloaded -->
  <link rel="preload" href="{{ '/assets/fonts/cormorant-garamond-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">

  <!-- Stylesheet -->
  <!-- ?v= is the build time, so a new deploy is never served a cached stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!-- Supabase (loaded on pages that need it) -->
  {% if page.supabase %}
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  {% endif %}
</head>
<body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <!-- Global JS -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% if page.supabase %}
  <script src="{{ '/assets/js/supabase.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
