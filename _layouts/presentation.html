<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{ page.title }} · Silvio di Rubbo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1A1814;
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1A1814;
      overflow: hidden;
    }

    /* THE STAGE: fixed 1280×720 (16:9). The ONLY scaled element. */
    #stage {
      width: 1280px;
      height: 720px;
      flex: 0 0 auto;
      position: relative;
      overflow: hidden;
      transform-origin: center center;
      font-family: 'Cormorant Garamond', serif;
      background: #1A1814;
    }

    /* Shared across all decks: cover slide's secondary gold meta line.   */
    /* Relies on --gold being defined in each deck's own :root block.     */
    .cover-meta-gold {
      font-family: 'DM Mono', monospace; font-weight: 300; font-size: 10px;
      letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 6px;
    }

    /* ── Chrome: absolute INSIDE the stage, with a translucent chip ── */
    /* so it stays legible on dark AND light slides.                   */
    .chrome {
      position: absolute;
      z-index: 50;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.28);
      color: rgba(255,255,255,.85);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      backdrop-filter: blur(2px);
      transition: color .2s, border-color .2s, background .2s;
    }
    #btn-back { top: 22px; right: 24px; }

    #nav {
      position: absolute;
      z-index: 50;
      bottom: 22px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #nav .chrome { position: static; }
    #nav-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      min-width: 50px;
      text-align: center;
      padding: 8px 6px;
      border-radius: 2px;
      background: rgba(0,0,0,.28);
      color: rgba(255,255,255,.7);
      backdrop-filter: blur(2px);
      transition: color .2s, background .2s;
    }
    .chrome:disabled { opacity: 0.3; cursor: default; }

    /* ── Print: one slide per page ──────────────────────────────── */
    @media print {
      html, body { overflow: visible; background: #FDFCFA; }
      #viewport { position: static; display: block; overflow: visible; background: none; }
      #stage {
        width: 100% !important;
        height: auto !important;
        transform: none !important;
        overflow: visible;
      }
      .chrome, #nav { display: none !important; }
      .slide {
        display: flex !important;
        position: relative !important;
        width: 100% !important;
        height: 100vh !important;
        page-break-after: always;
        break-after: page;
      }
      .slide-cover { background: #1A1814 !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="stage">

      {{ content }}

      <!-- Chrome inside the stage → scales with it, always aligned -->
      <a href="{{ '/tastings/' | relative_url }}" class="chrome" id="btn-back">← Back to tastings</a>
      <div id="nav">
        <button class="chrome" id="btn-prev">← Prev</button>
        <span id="nav-count"></span>
        <button class="chrome" id="btn-next">Next →</button>
      </div>

    </div>
  </div>

  <script>
  (function () {
    var stage = document.getElementById('stage');

    function fit() {
      var vw = (window.visualViewport ? window.visualViewport.width  : window.innerWidth);
      var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      stage.style.transform = 'scale(' + Math.min(vw / 1280, vh / 720) + ')';
    }
    fit();
    window.addEventListener('resize', fit);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fit);
      window.visualViewport.addEventListener('scroll', fit);
    }

    var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var total  = slides.length;
    var cur    = 0;

    function show(n) {
      if (!total) return;
      slides[cur].classList.remove('active');
      cur = Math.max(0, Math.min(total - 1, n));
      slides[cur].classList.add('active');

      document.getElementById('nav-count').textContent = (cur + 1) + ' / ' + total;
      document.getElementById('btn-prev').disabled = (cur === 0);
      document.getElementById('btn-next').disabled = (cur === total - 1);

      // Chrome chip adapts to slide background for guaranteed legibility
      var dark = slides[cur].classList.contains('slide-cover');
      var txt = dark ? 'rgba(255,255,255,.85)' : 'rgba(26,24,20,.7)';
      var brd = dark ? 'rgba(255,255,255,.35)' : 'rgba(26,24,20,.28)';
      var bg  = dark ? 'rgba(0,0,0,.28)'       : 'rgba(253,252,250,.78)';
      document.querySelectorAll('.chrome').forEach(function (b) {
        b.style.color = txt; b.style.borderColor = brd; b.style.background = bg;
      });
      var c = document.getElementById('nav-count');
      c.style.color = dark ? 'rgba(255,255,255,.7)' : 'rgba(26,24,20,.6)';
      c.style.background = bg;
    }

    document.getElementById('btn-prev').addEventListener('click', function (e) { e.stopPropagation(); show(cur - 1); });
    document.getElementById('btn-next').addEventListener('click', function (e) { e.stopPropagation(); show(cur + 1); });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') show(cur + 1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')                    show(cur - 1);
      if (e.key === 'Escape') window.location.href = '{{ "/tastings/" | relative_url }}';
    });

    stage.addEventListener('click', function (e) {
      if (e.target.closest('.chrome') || e.target.closest('#nav')) return;
      if (e.target.closest('.wine-map') || e.target.closest('.slide-cover') || e.target.closest('.slide-intro')) {
        show(cur + 1);
      }
    });

    show(0);
  })();
  </script>
</body>
</html>
